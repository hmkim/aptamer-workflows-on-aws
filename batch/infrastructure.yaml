AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Private AWS Batch infrastructure for copy-in, stage dependency, read-only Mountpoint,
  compatibility-check, and manifest-loader jobs, plus optional GPU capacity and private
  ECR repositories for RaptGen images. CPU and GPU compute are each optional.

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC containing the required private Batch subnets.
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets with no direct route to an internet gateway and no public IP assignment.
  PrivateRouteTableIds:
    Type: CommaDelimitedList
    Description: Route tables associated with PrivateSubnetIds for the S3 gateway endpoint.
  ProjectTag:
    Type: String
    Default: aptamer-workflows
    AllowedPattern: '^[A-Za-z0-9._-]{1,64}$'
  JobNamePrefix:
    Type: String
    Default: aptamer
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9_-]{0,31}$'
  DataPrefix:
    Type: String
    Default: input
    AllowedPattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$'
  EnableCpu:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: Create the CPU compute environment, CPU queue, CodeBuild image project, and pipeline job definitions.
  EnableGpu:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Create the GPU compute environment (ECS_AL2023_NVIDIA AMI) and GPU queue.
  ImageTag:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'
    Description: Immutable pipeline image tag built by the CodeBuild project. Required when EnableCpu is true.
  MaxvCpus:
    Type: Number
    Default: 72
    MinValue: 2
    MaxValue: 512
    Description: Maximum vCPUs of the CPU compute environment.
  InstanceTypes:
    Type: CommaDelimitedList
    Default: c7i,c6i
    Description: Instance types or families of the CPU compute environment.
  GpuInstanceTypes:
    Type: CommaDelimitedList
    Default: g5.xlarge,g6.xlarge
    Description: GPU instance types. Check the Running On-Demand G and VT instances vCPU quota first.
  GpuMaxvCpus:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 512
    Description: Maximum vCPUs of the GPU compute environment.
  ContainerUid:
    Type: Number
    Default: 57439
    MinValue: 1
  ContainerGid:
    Type: Number
    Default: 57439
    MinValue: 1
  RootVolumeSizeGiB:
    Type: Number
    Default: 200
    MinValue: 30
    MaxValue: 2000
  MountpointVersion:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[0-9]+\.[0-9]+\.[0-9]+$'
    Description: Exact Mountpoint for Amazon S3 release version, without a leading v. Required when EnableCpu is true.
  MountpointPackageSha256:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[A-Fa-f0-9]{64}$'
    Description: SHA-256 for the architecture-specific Mountpoint RPM. Required when EnableCpu is true.
  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [1, 3, 5, 7, 14, 30, 60, 90, 180, 365]

Conditions:
  CpuEnabled: !Equals [!Ref EnableCpu, 'true']
  GpuEnabled: !Equals [!Ref EnableGpu, 'true']

Rules:
  AtLeastOneComputeType:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref EnableCpu, 'true']
          - !Equals [!Ref EnableGpu, 'true']
        AssertDescription: Set EnableCpu, EnableGpu, or both to true.
  CpuInputsRequired:
    RuleCondition: !Equals [!Ref EnableCpu, 'true']
    Assertions:
      - Assert: !Not [!Equals [!Ref ImageTag, '']]
        AssertDescription: ImageTag is required when EnableCpu is true.
      - Assert: !Not [!Equals [!Ref MountpointVersion, '']]
        AssertDescription: MountpointVersion is required when EnableCpu is true.
      - Assert: !Not [!Equals [!Ref MountpointPackageSha256, '']]
        AssertDescription: MountpointPackageSha256 is required when EnableCpu is true.

Resources:
  DataKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: !Sub '${AWS::StackName} data encryption key'
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdministration
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'
      Tags:
        - {Key: Project, Value: !Ref ProjectTag}
  DataKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-data'
      TargetKeyId: !Ref DataKey

  DataBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DataKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
          - Id: ExpireBuildContext
            Status: Enabled
            Prefix: build/
            ExpirationInDays: 14
      Tags:
        - {Key: Project, Value: !Ref ProjectTag}
  WorkBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - BucketKeyEnabled: true
            ServerSideEncryptionByDefault:
              SSEAlgorithm: aws:kms
              KMSMasterKeyID: !GetAtt DataKey.Arn
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: AbortIncompleteMultipartUploads
            Status: Enabled
            AbortIncompleteMultipartUpload:
              DaysAfterInitiation: 7
      Tags:
        - {Key: Project, Value: !Ref ProjectTag}
  DataBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref DataBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt DataBucket.Arn
              - !Sub '${DataBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false
  WorkBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WorkBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: '*'
            Action: s3:*
            Resource:
              - !GetAtt WorkBucket.Arn
              - !Sub '${WorkBucket.Arn}/*'
            Condition:
              Bool:
                aws:SecureTransport: false

  ImageRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub '${AWS::StackName}-pipeline'
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt DataKey.Arn
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: false
      Tags:
        - {Key: Project, Value: !Ref ProjectTag}
  # RaptGen images are built locally with docker build and pushed here.
  RaptgenCpuRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub '${AWS::StackName}-raptgen-cpu'
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt DataKey.Arn
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: false
      Tags:
        - {Key: Project, Value: !Ref ProjectTag}
  RaptgenGpuRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: !Sub '${AWS::StackName}-raptgen-gpu'
      EncryptionConfiguration:
        EncryptionType: KMS
        KmsKey: !GetAtt DataKey.Arn
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EmptyOnDelete: false
      Tags:
        - {Key: Project, Value: !Ref ProjectTag}
  ImageBuildRole:
    Type: AWS::IAM::Role
    Condition: CpuEnabled
    Properties:
      Description: Builds and pushes the workflow container image.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: codebuild.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ImageBuild
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: BuildLogs
                Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-image*'
              - Sid: ReadBuildContext
                Effect: Allow
                Action: [s3:GetObject, s3:GetObjectVersion]
                Resource: !Sub '${DataBucket.Arn}/build/context.zip'
              - Sid: UseDataKey
                Effect: Allow
                Action: [kms:Decrypt, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
              - Sid: EcrAuthorization
                Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: PushRepository
                Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ImageRepository.Arn
  ImageBuildProject:
    Type: AWS::CodeBuild::Project
    Condition: CpuEnabled
    Properties:
      Name: !Sub '${AWS::StackName}-image'
      ServiceRole: !GetAtt ImageBuildRole.Arn
      Source:
        Type: S3
        Location: !Sub '${DataBucket}/build/context.zip'
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        PrivilegedMode: true
        EnvironmentVariables:
          - {Name: REPOSITORY_URI, Value: !GetAtt ImageRepository.RepositoryUri}
          - {Name: IMAGE_TAG, Value: !Ref ImageTag}
      LogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub '/aws/codebuild/${AWS::StackName}-image'
      TimeoutInMinutes: 60
      Tags:
        - {Key: Project, Value: !Ref ProjectTag}

  ComputeRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Batch host role for ECS, logs, image pulls, and read-only input mounting.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub 'arn:${AWS::Partition}:iam::aws:policy/service-role/AmazonEC2ContainerServiceforEC2Role'
      Policies:
        - PolicyName: ReadOnlyMountpointInput
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListInputPrefix
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - !Ref DataPrefix
                      - !Sub '${DataPrefix}/*'
              - Sid: ReadInputObjects
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${DataBucket.Arn}/${DataPrefix}/*'
              - Sid: DecryptInput
                Effect: Allow
                Action: [kms:Decrypt, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
  ComputeProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref ComputeRole]

  PipelineJobRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Pipeline jobs can read inputs and scripts and write only run outputs.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: PipelineDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListInputPrefix
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: [!Ref DataPrefix, !Sub '${DataPrefix}/*']
              - Sid: ReadInputs
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${DataBucket.Arn}/${DataPrefix}/*'
              - Sid: ListWorkPrefixes
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: !GetAtt WorkBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: [runs, 'runs/*']
              - Sid: ReadWriteRuns
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload, s3:ListMultipartUploadParts]
                Resource: !Sub '${WorkBucket.Arn}/runs/*'
              - Sid: UseDataKey
                Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn
  DataLoaderJobRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Loader jobs can read scripts and write only the configured input prefix.
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: LoaderDataAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListInputPrefix
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: !GetAtt DataBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: [!Ref DataPrefix, !Sub '${DataPrefix}/*']
              - Sid: ReadWriteInputObjects
                Effect: Allow
                Action: [s3:GetObject, s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub '${DataBucket.Arn}/${DataPrefix}/*'
              - Sid: ListManifestAndLoaderPrefixes
                Effect: Allow
                Action: [s3:GetBucketLocation, s3:ListBucket]
                Resource: !GetAtt WorkBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix: [manifests, 'manifests/*', runs/loader, 'runs/loader/*']
              - Sid: ReadManifests
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${WorkBucket.Arn}/manifests/*'
              - Sid: WriteLoaderArtifacts
                Effect: Allow
                Action: [s3:PutObject, s3:AbortMultipartUpload]
                Resource: !Sub '${WorkBucket.Arn}/runs/loader/*'
              - Sid: UseDataKey
                Effect: Allow
                Action: [kms:Decrypt, kms:Encrypt, kms:GenerateDataKey, kms:DescribeKey]
                Resource: !GetAtt DataKey.Arn

  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcEndpointType: Gateway
      VpcId: !Ref VpcId
      ServiceName: !Sub 'com.amazonaws.${AWS::Region}.s3'
      RouteTableIds: !Ref PrivateRouteTableIds
  ComputeSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Batch compute with no inbound rules and HTTPS-only outbound access.
      VpcId: !Ref VpcId
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS through private routing, VPC endpoints, or the NAT gateway.
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-compute'}
        - {Key: Project, Value: !Ref ProjectTag}

  ComputeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Condition: CpuEnabled
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-compute'
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              Encrypted: true
              VolumeSize: !Ref RootVolumeSizeGiB
              VolumeType: gp3
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - {Key: Name, Value: !Sub '${AWS::StackName}-compute'}
              - {Key: Project, Value: !Ref ProjectTag}
          - ResourceType: volume
            Tags:
              - {Key: Project, Value: !Ref ProjectTag}
        UserData:
          Fn::Base64: !Sub |
            MIME-Version: 1.0
            Content-Type: multipart/mixed; boundary="==BATCH_WORKFLOW=="

            --==BATCH_WORKFLOW==
            Content-Type: text/x-shellscript; charset="us-ascii"

            #!/bin/bash
            set -Eeuo pipefail
            exec >>/var/log/batch-workflow-bootstrap.log 2>&1
            architecture=$(uname -m)
            dnf install -y -q fuse3
            curl --fail --location --proto '=https' --proto-redir '=https' \
              "https://s3.amazonaws.com/mountpoint-s3-release/${MountpointVersion}/$architecture/mount-s3.rpm" \
              -o /var/tmp/mount-s3.rpm
            printf '%s  %s\n' '${MountpointPackageSha256}' /var/tmp/mount-s3.rpm | sha256sum -c -
            dnf install -y -q /var/tmp/mount-s3.rpm
            rm -f /var/tmp/mount-s3.rpm
            grep -q '^user_allow_other' /etc/fuse.conf || printf 'user_allow_other\n' >> /etc/fuse.conf
            mkdir -p /mnt/s3-data
            mount-s3 '${DataBucket}' /mnt/s3-data \
              --prefix '${DataPrefix}/' \
              --read-only \
              --allow-other \
              --uid '${ContainerUid}' \
              --gid '${ContainerGid}'

            --==BATCH_WORKFLOW==--

  ComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Condition: CpuEnabled
    Properties:
      Type: MANAGED
      State: ENABLED
      UpdatePolicy:
        TerminateJobsOnUpdate: false
        JobExecutionTimeoutMinutes: 30
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        DesiredvCpus: 0
        MaxvCpus: !Ref MaxvCpus
        InstanceTypes: !Ref InstanceTypes
        InstanceRole: !GetAtt ComputeProfile.Arn
        Subnets: !Ref PrivateSubnetIds
        SecurityGroupIds: [!Ref ComputeSecurityGroup]
        LaunchTemplate:
          LaunchTemplateId: !Ref ComputeLaunchTemplate
          Version: !GetAtt ComputeLaunchTemplate.LatestVersionNumber
        Ec2Configuration:
          - ImageType: ECS_AL2023
        UpdateToLatestImageVersion: true
        Tags:
          Project: !Ref ProjectTag
  JobQueue:
    Type: AWS::Batch::JobQueue
    Condition: CpuEnabled
    Properties:
      JobQueueName: !Sub '${AWS::StackName}-queue'
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref ComputeEnvironment

  # GPU capacity: no Mountpoint bootstrap, same private subnets, security
  # group, IMDSv2 settings, and encrypted root volume as the CPU hosts.
  GpuLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Condition: GpuEnabled
    Properties:
      LaunchTemplateName: !Sub '${AWS::StackName}-gpu'
      LaunchTemplateData:
        MetadataOptions:
          HttpEndpoint: enabled
          HttpTokens: required
          HttpPutResponseHopLimit: 1
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              DeleteOnTermination: true
              Encrypted: true
              VolumeSize: !Ref RootVolumeSizeGiB
              VolumeType: gp3
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - {Key: Name, Value: !Sub '${AWS::StackName}-gpu'}
              - {Key: Project, Value: !Ref ProjectTag}
          - ResourceType: volume
            Tags:
              - {Key: Project, Value: !Ref ProjectTag}
  GpuComputeEnvironment:
    Type: AWS::Batch::ComputeEnvironment
    Condition: GpuEnabled
    Properties:
      Type: MANAGED
      State: ENABLED
      UpdatePolicy:
        TerminateJobsOnUpdate: false
        JobExecutionTimeoutMinutes: 30
      ComputeResources:
        Type: EC2
        AllocationStrategy: BEST_FIT_PROGRESSIVE
        MinvCpus: 0
        DesiredvCpus: 0
        MaxvCpus: !Ref GpuMaxvCpus
        InstanceTypes: !Ref GpuInstanceTypes
        InstanceRole: !GetAtt ComputeProfile.Arn
        Subnets: !Ref PrivateSubnetIds
        SecurityGroupIds: [!Ref ComputeSecurityGroup]
        LaunchTemplate:
          LaunchTemplateId: !Ref GpuLaunchTemplate
          Version: !GetAtt GpuLaunchTemplate.LatestVersionNumber
        Ec2Configuration:
          - ImageType: ECS_AL2023_NVIDIA
        UpdateToLatestImageVersion: true
        Tags:
          Project: !Ref ProjectTag
  GpuJobQueue:
    Type: AWS::Batch::JobQueue
    Condition: GpuEnabled
    Properties:
      JobQueueName: !Sub '${AWS::StackName}-gpu-queue'
      State: ENABLED
      Priority: 1
      ComputeEnvironmentOrder:
        - Order: 1
          ComputeEnvironment: !Ref GpuComputeEnvironment
  LogGroup:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/batch/${AWS::StackName}'
      RetentionInDays: !Ref LogRetentionDays

  PipelineJobDefinition:
    Type: AWS::Batch::JobDefinition
    Condition: CpuEnabled
    Properties:
      JobDefinitionName: !Sub '${AWS::StackName}-pipeline'
      Type: container
      PlatformCapabilities: [EC2]
      PropagateTags: true
      Timeout: {AttemptDurationSeconds: 14400}
      RetryStrategy:
        Attempts: 2
        EvaluateOnExit:
          - {OnStatusReason: 'Host EC2*', Action: RETRY}
          - {OnStatusReason: 'Task failed to start', Action: RETRY}
          - {OnReason: '*', Action: EXIT}
      ContainerProperties:
        Image: !Sub '${ImageRepository.RepositoryUri}:${ImageTag}'
        JobRoleArn: !GetAtt PipelineJobRole.Arn
        User: !Sub '${ContainerUid}:${ContainerGid}'
        Privileged: false
        ReadonlyRootFilesystem: false
        ResourceRequirements:
          - {Type: VCPU, Value: '4'}
          - {Type: MEMORY, Value: '7000'}
        Command:
          - bash
          - -c
          - >-
            set -euo pipefail;
            exec bash "/opt/aptamer/batch/${JOB_SCRIPT}" "${JOB_ARGS:-}"
        Environment:
          - {Name: AWS_DEFAULT_REGION, Value: !Ref 'AWS::Region'}
          - {Name: DATA_BUCKET, Value: !Ref DataBucket}
          - {Name: DATA_PREFIX, Value: !Ref DataPrefix}
          - {Name: WORK_BUCKET, Value: !Ref WorkBucket}
          - {Name: LOCAL_SCRATCH, Value: /tmp/aptamer}
          - {Name: JOB_SCRIPT, Value: run_copyin.sh}
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref LogGroup
            awslogs-region: !Ref 'AWS::Region'
            awslogs-stream-prefix: pipeline
      Tags:
        Project: !Ref ProjectTag

  MountpointJobDefinition:
    Type: AWS::Batch::JobDefinition
    Condition: CpuEnabled
    Properties:
      JobDefinitionName: !Sub '${AWS::StackName}-mountpoint'
      Type: container
      PlatformCapabilities: [EC2]
      PropagateTags: true
      Timeout: {AttemptDurationSeconds: 14400}
      RetryStrategy:
        Attempts: 2
        EvaluateOnExit:
          - {OnStatusReason: 'Host EC2*', Action: RETRY}
          - {OnStatusReason: 'Task failed to start', Action: RETRY}
          - {OnReason: '*', Action: EXIT}
      ContainerProperties:
        Image: !Sub '${ImageRepository.RepositoryUri}:${ImageTag}'
        JobRoleArn: !GetAtt PipelineJobRole.Arn
        User: !Sub '${ContainerUid}:${ContainerGid}'
        Privileged: false
        ReadonlyRootFilesystem: false
        ResourceRequirements:
          - {Type: VCPU, Value: '4'}
          - {Type: MEMORY, Value: '7000'}
        Command:
          - bash
          - -c
          - >-
            set -euo pipefail;
            exec bash "/opt/aptamer/batch/${JOB_SCRIPT}" "${JOB_ARGS:-}"
        Environment:
          - {Name: AWS_DEFAULT_REGION, Value: !Ref 'AWS::Region'}
          - {Name: DATA_BUCKET, Value: !Ref DataBucket}
          - {Name: DATA_PREFIX, Value: !Ref DataPrefix}
          - {Name: WORK_BUCKET, Value: !Ref WorkBucket}
          - {Name: LOCAL_SCRATCH, Value: /tmp/aptamer}
          - {Name: MOUNT_PATH, Value: /mnt/s3-data}
          - {Name: MOUNT_INPUT_DIR, Value: /mnt/s3-data}
          - {Name: JOB_SCRIPT, Value: run_mountpoint.sh}
        Volumes:
          - Name: s3data
            Host: {SourcePath: /mnt/s3-data}
        MountPoints:
          - {SourceVolume: s3data, ContainerPath: /mnt/s3-data, ReadOnly: true}
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref LogGroup
            awslogs-region: !Ref 'AWS::Region'
            awslogs-stream-prefix: mountpoint
      Tags:
        Project: !Ref ProjectTag

  DataLoaderJobDefinition:
    Type: AWS::Batch::JobDefinition
    Condition: CpuEnabled
    Properties:
      JobDefinitionName: !Sub '${AWS::StackName}-loader'
      Type: container
      PlatformCapabilities: [EC2]
      PropagateTags: true
      Timeout: {AttemptDurationSeconds: 7200}
      RetryStrategy: {Attempts: 1}
      ContainerProperties:
        Image: !Sub '${ImageRepository.RepositoryUri}:${ImageTag}'
        JobRoleArn: !GetAtt DataLoaderJobRole.Arn
        User: !Sub '${ContainerUid}:${ContainerGid}'
        Privileged: false
        ReadonlyRootFilesystem: false
        ResourceRequirements:
          - {Type: VCPU, Value: '2'}
          - {Type: MEMORY, Value: '3500'}
        Command:
          - bash
          - -c
          - >-
            set -euo pipefail;
            exec bash "/opt/aptamer/batch/${JOB_SCRIPT}" "${JOB_ARGS:-}"
        Environment:
          - {Name: AWS_DEFAULT_REGION, Value: !Ref 'AWS::Region'}
          - {Name: DATA_BUCKET, Value: !Ref DataBucket}
          - {Name: DATA_PREFIX, Value: !Ref DataPrefix}
          - {Name: WORK_BUCKET, Value: !Ref WorkBucket}
          - {Name: LOCAL_SCRATCH, Value: /tmp/aptamer}
          - {Name: JOB_SCRIPT, Value: load_data.sh}
        LogConfiguration:
          LogDriver: awslogs
          Options:
            awslogs-group: !Ref LogGroup
            awslogs-region: !Ref 'AWS::Region'
            awslogs-stream-prefix: loader
      Tags:
        Project: !Ref ProjectTag

Outputs:
  ImageBuildProjectName:
    Condition: CpuEnabled
    Value: !Ref ImageBuildProject
  DataBucketName:
    Value: !Ref DataBucket
  DataPrefix:
    Value: !Ref DataPrefix
  WorkBucketName:
    Value: !Ref WorkBucket
  RepositoryUri:
    Value: !GetAtt ImageRepository.RepositoryUri
  JobQueueName:
    Description: CPU queue when EnableCpu is true, otherwise the GPU queue.
    Value: !If [CpuEnabled, !Sub '${AWS::StackName}-queue', !Sub '${AWS::StackName}-gpu-queue']
  CpuJobQueueName:
    Condition: CpuEnabled
    Value: !Sub '${AWS::StackName}-queue'
  GpuJobQueueName:
    Condition: GpuEnabled
    Value: !Sub '${AWS::StackName}-gpu-queue'
  CpuEnabled:
    Value: !Ref EnableCpu
  GpuEnabled:
    Value: !Ref EnableGpu
  RaptgenCpuRepositoryUri:
    Value: !GetAtt RaptgenCpuRepository.RepositoryUri
  RaptgenGpuRepositoryUri:
    Value: !GetAtt RaptgenGpuRepository.RepositoryUri
  ComputeSecurityGroupId:
    Value: !Ref ComputeSecurityGroup
  PipelineJobDefinitionArn:
    Condition: CpuEnabled
    Value: !Ref PipelineJobDefinition
  MountpointJobDefinitionArn:
    Condition: CpuEnabled
    Value: !Ref MountpointJobDefinition
  DataLoaderJobDefinitionArn:
    Condition: CpuEnabled
    Value: !Ref DataLoaderJobDefinition
  PipelineJobRoleArn:
    Value: !GetAtt PipelineJobRole.Arn
  KmsKeyArn:
    Value: !GetAtt DataKey.Arn
  LogGroupName:
    Value: !Ref LogGroup
  JobNamePrefix:
    Value: !Ref JobNamePrefix
  ProjectTag:
    Value: !Ref ProjectTag
