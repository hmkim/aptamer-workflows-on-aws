AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Shared private two-Availability-Zone network for AWS Batch, an optional
  RaptGen-UI EC2 instance, and optional AWS HealthOmics VPC-mode runs.

# HealthOmics VPC mode (not yet validated) accepts at most one subnet per
# Availability Zone and only private subnets with a NAT route. The two private
# subnets below therefore sit in two different Availability Zones and route
# 0.0.0.0/0 to the NAT gateway. HealthOmics operates only in listed AZs per
# Region (for example us-west-2a-d, us-east-1a/b/c/d/f, ap-northeast-1a/c/d);
# set AvailabilityZone1/2 explicitly if the first two AZs returned by
# Fn::GetAZs are not on that list in your Region.

Parameters:
  VpcCidr:
    Type: String
    Default: 10.64.0.0/16
    AllowedPattern: '^(10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.).*'
  PublicSubnetCidr:
    Type: String
    Default: 10.64.0.0/24
  PrivateSubnet1Cidr:
    Type: String
    Default: 10.64.10.0/24
  PrivateSubnet2Cidr:
    Type: String
    Default: 10.64.20.0/24
  ProjectTag:
    Type: String
    Default: aptamer-workflows
    AllowedPattern: '^[A-Za-z0-9._-]{1,64}$'
  AvailabilityZone1:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z]{2}(-[a-z]+)+-[0-9][a-z]$'
    Description: Optional AZ name for private subnet 1 and the NAT subnet. Empty selects the first AZ in the Region.
  AvailabilityZone2:
    Type: String
    Default: ''
    AllowedPattern: '^$|^[a-z]{2}(-[a-z]+)+-[0-9][a-z]$'
    Description: Optional AZ name for private subnet 2; must differ from AvailabilityZone1. Empty selects the second AZ in the Region.

Conditions:
  HasAz1: !Not [!Equals [!Ref AvailabilityZone1, '']]
  HasAz2: !Not [!Equals [!Ref AvailabilityZone2, '']]

Rules:
  DistinctAvailabilityZones:
    Assertions:
      - Assert: !Or
          - !Equals [!Ref AvailabilityZone1, '']
          - !Not [!Equals [!Ref AvailabilityZone1, !Ref AvailabilityZone2]]
        AssertDescription: AvailabilityZone1 and AvailabilityZone2 must differ (HealthOmics VPC mode allows one subnet per AZ).

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      InstanceTenancy: default
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-vpc'}
        - {Key: Project, Value: !Ref ProjectTag}
  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-igw'}
        - {Key: Project, Value: !Ref ProjectTag}
  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway
  NatSubnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !If [HasAz1, !Ref AvailabilityZone1, !Select [0, !GetAZs '']]
      CidrBlock: !Ref PublicSubnetCidr
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-nat'}
        - {Key: Project, Value: !Ref ProjectTag}
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !If [HasAz1, !Ref AvailabilityZone1, !Select [0, !GetAZs '']]
      CidrBlock: !Ref PrivateSubnet1Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-private-1'}
        - {Key: Project, Value: !Ref ProjectTag}
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      AvailabilityZone: !If [HasAz2, !Ref AvailabilityZone2, !Select [1, !GetAZs '']]
      CidrBlock: !Ref PrivateSubnet2Cidr
      MapPublicIpOnLaunch: false
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-private-2'}
        - {Key: Project, Value: !Ref ProjectTag}
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  NatSubnetRouteAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref NatSubnet
      RouteTableId: !Ref PublicRouteTable
  NatAddress:
    Type: AWS::EC2::EIP
    DependsOn: GatewayAttachment
    Properties:
      Domain: vpc
  NatGateway:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatAddress.AllocationId
      SubnetId: !Ref NatSubnet
      ConnectivityType: public
      Tags:
        - {Key: Name, Value: !Sub '${AWS::StackName}-nat'}
        - {Key: Project, Value: !Ref ProjectTag}
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
  PrivateDefaultRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateDefaultRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway
  PrivateRouteAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1
  PrivateRouteAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

Outputs:
  VpcId:
    Value: !Ref Vpc
  PrivateSubnetIds:
    Value: !Join [',', [!Ref PrivateSubnet1, !Ref PrivateSubnet2]]
  PrivateRouteTableIds:
    Value: !Join [',', [!Ref PrivateRouteTable1, !Ref PrivateRouteTable2]]
  VpcCidr:
    Description: VPC CIDR, used to scope optional interface endpoint security groups.
    Value: !GetAtt Vpc.CidrBlock
  PrivateSubnetAvailabilityZones:
    Value: !Join [',', [!GetAtt PrivateSubnet1.AvailabilityZone, !GetAtt PrivateSubnet2.AvailabilityZone]]
